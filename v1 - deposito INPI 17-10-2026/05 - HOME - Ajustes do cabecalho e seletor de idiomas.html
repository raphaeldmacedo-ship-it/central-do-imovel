<style>
.blogbox .bb{opacity:1!important;transform:none!important}
.blogbox .bb-head .eyebrow{font-size:13px}
header .nav{display:grid!important;grid-template-columns:auto 1fr auto auto auto;align-items:center;column-gap:22px}
header .nav>a:first-child{display:flex;align-items:center;justify-self:start}
header .nav>a:first-child{min-width:max-content}
header .nav>a:first-child img{height:40px!important;width:auto!important;max-width:none!important;max-height:none!important;flex:0 0 auto;object-fit:contain;aspect-ratio:auto 704/260}
header .nav .btn{justify-self:end}
header .links{justify-content:center;gap:30px;white-space:nowrap}
header .links a[href="#teste"],header .links a[href="#atualidades"]{display:none}
header .ms-user{margin:0;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;white-space:nowrap}
#tt-lang{display:flex;align-items:center}
#tt-lang .weglot-container{position:relative!important;inset:auto!important;margin:0!important;z-index:60}
#tt-lang .country-selector{background:#fff!important;border:1px solid var(--line)!important;border-radius:999px!important;overflow:hidden;font-family:Calibri,Carlito,sans-serif!important}
#tt-lang .country-selector a,#tt-lang .country-selector .wgcurrent a{font-size:13px!important;color:var(--purple-deep)!important}
img.wg-flag[src*="/pt.svg"]{content:url(https://cdn.weglot.com/flags/circle/br.svg)}
.weglot-container:not(#tt-lang .weglot-container){display:none!important}
@media (max-width:1180px){header .links{gap:20px;font-size:14px}header .nav .btn span{display:none}}
@media (max-width:980px){header .nav{grid-template-columns:auto 1fr auto auto}header .ms-user{display:none!important}}
</style>
<script type="text/javascript" src="https://cdn.weglot.com/weglot.min.js"></script>
<script>
(function(){
var e=document.querySelector('.blogbox .bb-head .eyebrow');if(e)e.textContent='Artigos recentes do blog';
var l=document.querySelector('.blogbox .bb-head .link');if(l)l.textContent='Ver todos os artigos →';
window.addEventListener('load',function(){if(window.ScrollTrigger)ScrollTrigger.refresh()});
var nav=document.querySelector('header .nav'),btn=nav?nav.querySelector('.btn'):null;if(nav&&btn&&!document.getElementById('tt-lang')){var d=document.createElement('div');d.id='tt-lang';nav.insertBefore(d,btn)}
/* Bandeira do Brasil para o português */
function br(){document.querySelectorAll('img.wg-flag').forEach(function(i){if(/\/pt\.svg/.test(i.src))i.src=i.src.replace(/\/pt\.svg/,'/br.svg')})}
new MutationObserver(br).observe(document.documentElement,{childList:true,subtree:true});
if(window.Weglot){Weglot.initialize({api_key:'wg_[CHAVE DE CLIENTE OCULTADA NA COPIA DE DEPOSITO]',hide_switcher:false,switchers:[{style:{full_name:true,with_name:true,is_dropdown:true,with_flags:true,flag_type:'circle'},location:{target:'#tt-lang',sibling:null}}]})}
})();
</script>
