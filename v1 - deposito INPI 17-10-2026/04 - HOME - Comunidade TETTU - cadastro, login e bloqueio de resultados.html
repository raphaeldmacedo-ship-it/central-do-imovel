<script>
(function(){
var LK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var logged=false,pend=null;
/* resultados dos simuladores: aparecem borrados até o cadastro */
document.querySelectorAll('#ferramentas .fx-out,#ferramentas .cmp,#ferramentas .ast-out').forEach(function(c){c.classList.add('tt-res');var b=document.createElement('button');b.type='button';b.className='tt-lock';b.setAttribute('data-ms','su');b.setAttribute('data-why','res');b.innerHTML=LK+'Cadastre-se grátis para ver o resultado';c.appendChild(b)});
/* certidões, pedidos e links: cadastro na hora do clique */
var GATED='#lgrid a,#lwa,.lq-cta a,#as-w,#as-o a,#nl-o a,.fx-ask a';
document.addEventListener('click',function(e){if(logged)return;var a=e.target.closest(GATED);if(!a)return;e.preventDefault();e.stopPropagation();pend=a.href||null;open('su','cert')},true);
/* cabeçalho: entrar / sair */
var nav=document.querySelector('header .nav');var u=document.createElement('div');u.className='ms-user';u.id='ms-user';
var cta=nav?nav.querySelector('.btn'):null;if(nav&&cta)nav.insertBefore(u,cta);
var M=document.getElementById('msm');
var SUB={res:'Seu resultado está pronto. Faça o cadastro gratuito para ver o valor e usar todas as ferramentas.',cert:'Para acessar as certidões e fazer pedidos, faça seu cadastro gratuito. Leva 30 segundos.',def:'Acesso livre à Central do Imóvel e às Ferramentas: certidões de 5 estados, simuladores, assistente e normas.'};
function open(which,why){var ss=document.getElementById('su-sub');if(ss)ss.textContent=SUB[why]||SUB.def;document.getElementById('msm-su').style.display=which==='li'?'none':'block';document.getElementById('msm-li').style.display=which==='li'?'block':'none';M.classList.add('on');setTimeout(function(){var f=M.querySelector(which==='li'?'#li-e':'#su-n');if(f)f.focus()},60)}
function close(){M.classList.remove('on')}
function toast(h){var t=document.getElementById('tt-toast');t.innerHTML=h;t.style.display='block';setTimeout(function(){t.style.display='none'},9000)}
document.addEventListener('click',function(e){var t=e.target.closest('[data-ms]');if(t){e.preventDefault();pend=null;open(t.getAttribute('data-ms'),t.getAttribute('data-why'))}});
document.getElementById('msm-x').onclick=close;M.addEventListener('click',function(e){if(e.target===M)close()});document.addEventListener('keydown',function(e){if(e.key==='Escape')close()});
document.getElementById('to-li').onclick=function(){open('li')};document.getElementById('to-su').onclick=function(){open('su')};
function unlock(m){m=m&&(m.member||m);logged=true;document.body.classList.add('tt-in');var n=(m&&m.customFields&&m.customFields['first-name'])||'';u.innerHTML='Olá, <b>'+(n||'membro')+'</b> · <a id="ms-out">Sair</a>';u.style.display='flex';var o=document.getElementById('ms-out');if(o)o.onclick=function(){ms().logout().then(function(){location.reload()})};
if(pend){var h=pend;pend=null;var w=window.open(h,'_blank','noopener');if(!w)toast('Cadastro concluído! <a href="'+h+'" target="_blank" rel="noopener">Abrir o link agora →</a>');else toast('Cadastro concluído! Bem-vindo à Comunidade TETTU.')}}
function lockUi(){logged=false;document.body.classList.remove('tt-in');u.innerHTML='<a data-ms="li">Entrar</a>';u.style.display='flex'}
function ms(){return window.$memberstackDom}
function ready(cb,t){t=t||0;if(ms())return cb();if(t>80){logged=true;document.body.classList.add('tt-in');return}setTimeout(function(){ready(cb,t+1)},150)}
ready(function(){ms().getCurrentMember().then(function(r){if(r&&r.data)unlock(r.data);else lockUi()}).catch(lockUi)});
/* CPF */
var cpf=document.getElementById('su-c');cpf.addEventListener('input',function(){var v=cpf.value.replace(/\D/g,'').slice(0,11);v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');cpf.value=v});
function cpfOk(s){s=s.replace(/\D/g,'');if(s.length!==11||/^(\d)\1+$/.test(s))return false;for(var t=9;t<11;t++){var d=0;for(var c=0;c<t;c++)d+=s[c]*((t+1)-c);d=((10*d)%11)%10;if(+s[t]!==d)return false}return true}
function err(id,m){var e=document.getElementById(id);e.textContent=m;e.style.display=m?'block':'none'}
function trad(m){m=String(m||'');if(/already|exists|taken/i.test(m))return 'Este e-mail já tem cadastro. Clique em "Entrar".';if(/password/i.test(m)&&/invalid|incorrect|wrong/i.test(m))return 'E-mail ou senha incorretos.';if(/not found|no member/i.test(m))return 'Não encontramos esse e-mail. Faça seu cadastro.';if(/password/i.test(m))return 'A senha precisa ter pelo menos 8 caracteres.';return 'Não foi possível concluir agora. Tente novamente em instantes.'}
document.getElementById('f-su').addEventListener('submit',function(e){e.preventDefault();err('su-err','');
var g=function(i){return document.getElementById(i).value.trim()};var n=g('su-n'),s=g('su-s'),em=g('su-e'),c=g('su-c'),f=g('su-f'),p=document.getElementById('su-p').value,l=document.getElementById('su-l').checked;
if(!n||!s)return err('su-err','Informe nome e sobrenome.');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))return err('su-err','Informe um e-mail válido.');if(!cpfOk(c))return err('su-err','CPF inválido. Confira os números.');if(!f)return err('su-err','Selecione a finalidade.');if(p.length<8)return err('su-err','A senha precisa ter pelo menos 8 caracteres.');if(!l)return err('su-err','Para continuar, aceite a Política de Privacidade (LGPD).');
var b=document.getElementById('su-b');b.disabled=true;b.textContent='Criando seu acesso...';
ready(function(){ms().signupMemberEmailPassword({email:em,password:p,customFields:{'first-name':n,'last-name':s}}).then(function(r){
return ms().updateMemberJSON({json:{cpf:c,finalidade:f,lgpd:{aceite:true,texto:'Política de Privacidade TETTU · Lei 13.709/2018',data:new Date().toISOString()},origem:location.hostname}}).catch(function(){}).then(function(){close();unlock(r&&r.data)})
}).catch(function(x){err('su-err',trad(x&&x.message))}).then(function(){b.disabled=false;b.textContent='Criar meu acesso gratuito'})})});
document.getElementById('f-li').addEventListener('submit',function(e){e.preventDefault();err('li-err','');var em=document.getElementById('li-e').value.trim(),p=document.getElementById('li-p').value;if(!em||!p)return err('li-err','Informe e-mail e senha.');
var b=document.getElementById('li-b');b.disabled=true;b.textContent='Entrando...';
ready(function(){ms().loginMemberEmailPassword({email:em,password:p}).then(function(r){close();unlock(r&&r.data)}).catch(function(x){err('li-err',trad(x&&x.message))}).then(function(){b.disabled=false;b.textContent='Entrar'})})});
})();
</script>
